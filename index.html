function formatMMSS(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60);
  const r = s % 60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}

function showRevokeUI(title, message){
  const ov = document.getElementById('revokeOverlay');
  const t = document.getElementById('revokeTitle');
  const m = document.getElementById('revokeMsg');
  const c = document.getElementById('revokeCount');
  if (t) t.textContent = title;
  if (m) m.textContent = message;
  if (c) c.textContent = '01:30';
  if (ov) ov.classList.add('show');
}

function triggerSessionRevoke(title, message){
  if (window.__sessionRevoked) return;
  window.__sessionRevoked = true;
  showRevokeUI(title, message);
  const countEl = document.getElementById('revokeCount');
  if (countEl) {
    countEl.classList.remove('show');
    countEl.textContent = '01:30';
  }
  // Background total ~2:00 until process kill
  try {
    if (window.Android && typeof window.Android.setRevokeMessage === 'function') {
      window.Android.setRevokeMessage(title);
    }
  } catch(e) {}
  try {
    if (window.Android && typeof window.Android.startNativeTimer === 'function') {
      window.Android.startNativeTimer('120000');
    }
  } catch(e) {}

  // Phase 1: message only for 30s
  // Phase 2: smooth reveal 01:30 countdown, then close
  const phase2At = Date.now() + 30000;
  const endAt = Date.now() + 120000;
  let phase2 = false;
  const tick = () => {
    const now = Date.now();
    const c = document.getElementById('revokeCount');
    if (!phase2 && now >= phase2At) {
      phase2 = true;
      if (c) {
        c.textContent = '01:30';
        requestAnimationFrame(() => c.classList.add('show'));
      }
    }
    if (phase2 && c) {
      const left = Math.max(0, endAt - now);
      c.textContent = formatMMSS(left);
    }
    if (now >= endAt) {
      try { if (window.Android && typeof window.Android.expire === 'function') window.Android.expire(); } catch(e) {}
      return;
    }
    setTimeout(tick, 200);
  };
  tick();
  setTimeout(() => {
    try { if (window.Android && typeof window.Android.expire === 'function') window.Android.expire(); } catch(e) {}
  }, 122000);
}

function triggerCriticalShutdown(){
  if (window.__sessionRevoked) return;
  window.__sessionRevoked = true;
  const ov = document.getElementById('revokeOverlay');
  const box = ov && ov.querySelector('.revoke-box');
  const t = document.getElementById('revokeTitle');
  const m = document.getElementById('revokeMsg');
  const c = document.getElementById('revokeCount');
  if (t) t.textContent = 'Critical shutdown';
  if (m) m.textContent = 'Emergency close ordered by administrator.';
  if (c) { c.textContent = '10'; c.classList.add('show'); }
  if (box) box.classList.add('critical');
  if (ov) ov.classList.add('show');
  try {
    if (window.Android && typeof window.Android.setRevokeMessage === 'function') {
      window.Android.setRevokeMessage('Critical shutdown');
    }
  } catch(e) {}
  try {
    if (window.Android && typeof window.Android.startNativeTimer === 'function') {
      window.Android.startNativeTimer('10000');
    }
  } catch(e) {}
  const endAt = Date.now() + 10000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((endAt - Date.now())/1000));
    if (c) c.textContent = String(left);
    if (left <= 0) {
      try { if (window.Android && typeof window.Android.expire === 'function') window.Android.expire(); } catch(e) {}
      return;
    }
    setTimeout(tick, 200);
  };
  tick();
  setTimeout(() => {
    try { if (window.Android && typeof window.Android.expire === 'function') window.Android.expire(); } catch(e) {}
  }, 10500);
}

async function startSessionGuard(meta){
  if (window.__sessionGuardStarted) return;
  window.__sessionGuardStarted = true;
  window.__sessionMeta = meta || {};
  const deviceId = meta.deviceId || (typeof getDeviceFingerprint === 'function' ? getDeviceFingerprint() : '');
  const key = (meta.key || '').trim();
  const uid = meta.uid || null;
  const kind = meta.kind || 'normal'; // master | normal

  try {
    // 1) User / device ban
    const checkUserBan = (data) => {
      if (!data) return;
      const norm = (s) => String(s||'').trim().toLowerCase().replace(/\s+/g,'');
      const my = norm(deviceId);
      for (const id in data) {
        const u = data[id] || {};
        if (u.status !== 'banned') continue;
        if (uid && id === uid) {
          triggerSessionRevoke("You're banned", u.banReason || "You're banned by the administrator.");
          return;
        }
        if (my && (norm(id)===my || norm(u.deviceId)===my || norm(u.fingerprint)===my ||
            norm(u.lastDeviceId)===my || norm(u.androidId)===my || norm(u.lastLoginDevice)===my)) {
          triggerSessionRevoke("You're banned", u.banReason || "You're banned by the administrator.");
          return;
        }
      }
    };
    onValue(ref(db, 'users'), (snap) => {
      if (window.__sessionRevoked) return;
      if (snap.exists()) checkUserBan(snap.val());
    });

    // 2) Key banned (normal keys)
    if (kind === 'normal' && key) {
      onValue(ref(db, 'settings/bannedKeys/' + key), (snap) => {
        if (window.__sessionRevoked) return;
        if (snap.exists()) {
          const reason = (snap.val() && snap.val().reason) || 'Key banned. Generate a new key to continue.';
          triggerSessionRevoke('Key banned', reason);
        }
      });
    }

    // 2b) Normal key deleted OR expired (while session open)
    // Watches owning user (uid) or any user still holding this lastGeneratedKey
    if (kind === 'normal' && key) {
      const wantKey = String(key).trim();
      const watchUid = meta.uid || null;
      const expHint = meta.expiresAt != null ? Number(meta.expiresAt) : null;

      // Local timer if we already know expiry at login
      if (expHint && expHint > Date.now()) {
        const delay = expHint - Date.now() + 200;
        setTimeout(function(){
          if (window.__sessionRevoked) return;
          triggerSessionRevoke('Key expired', 'Your access key has expired. App will close.');
        }, delay);
      } else if (expHint && expHint <= Date.now()) {
        triggerSessionRevoke('Key expired', 'Your access key has expired. App will close.');
      }

      onValue(ref(db, 'users'), (snap) => {
        if (window.__sessionRevoked) return;
        if (!snap.exists()) {
          // All users wiped — treat as key inactive
          triggerSessionRevoke('Key deleted', 'Your key is no longer active. App will close.');
          return;
        }
        const all = snap.val() || {};
        const now = Date.now();

        if (watchUid && all[watchUid]) {
          const u = all[watchUid] || {};
          const live = String(u.lastGeneratedKey || '').trim();
          if (!live || live !== wantKey) {
            triggerSessionRevoke('Key deleted', 'Your key was removed or replaced. App will close.');
            return;
          }
          if (u.keyExpiresAt && Number(u.keyExpiresAt) <= now) {
            triggerSessionRevoke('Key expired', 'Your access key has expired. App will close.');
            return;
          }
          return;
        }

        // No uid: find any owner of this key
        let owner = null;
        for (const id in all) {
          const u = all[id] || {};
          if (String(u.lastGeneratedKey || '').trim() === wantKey) {
            owner = u;
            break;
          }
        }
        if (!owner) {
          triggerSessionRevoke('Key deleted', 'Your key is no longer active. App will close.');
          return;
        }
        if (owner.keyExpiresAt && Number(owner.keyExpiresAt) <= now) {
          triggerSessionRevoke('Key expired', 'Your access key has expired. App will close.');
        }
      });
    }

    // 3) Master key deleted / expired (all types) from settings/masterKeys
    if (kind === 'master' && key) {
      const wantKey = String(key).trim();
      const expHint = meta.expiresAt != null ? Number(meta.expiresAt) : null;

      if (expHint && expHint > Date.now()) {
        const delay = expHint - Date.now() + 200;
        setTimeout(function(){
          if (window.__sessionRevoked) return;
          triggerSessionRevoke('Master key expired', 'This master key has expired. App will close.');
        }, delay);
      } else if (expHint && expHint <= Date.now()) {
        triggerSessionRevoke('Master key expired', 'This master key has expired. App will close.');
      }

      onValue(ref(db, 'settings/masterKeys'), (snap) => {
        if (window.__sessionRevoked) return;
        let found = null;
        if (snap.exists()) {
          const val = snap.val() || {};
          for (const k in val) {
            const entry = val[k];
            const keyStr = (typeof entry === 'string') ? entry.trim() : String((entry && entry.key) || '').trim();
            if (keyStr === wantKey) {
              found = (typeof entry === 'string') ? { key: keyStr, type: 'pure' } : entry;
              break;
            }
          }
        }
        if (!found) {
          triggerSessionRevoke('Master key revoked by admin', 'Master key revoked by admin. App will close.');
          return;
        }
        // Time-limited types: expire while session is open
        const t = String(found.type || 'pure');
        if ((t === 'time' || t === 'device_time') && found.expiresAt) {
          if (Date.now() > Number(found.expiresAt)) {
            triggerSessionRevoke('Master key expired', 'This master key has expired. App will close.');
          }
        }
      });
    }

    // 4) Global kill switch from admin
    onValue(ref(db, 'settings/globalKill'), (snap) => {
      if (window.__sessionRevoked) return;
      if (!snap.exists()) return;
      const v = snap.val();
      const active = (v === true) || (v && (v.active === true || v === 1));
      if (active) triggerCriticalShutdown();
    });
  } catch (e) {
    console.warn('session guard', e);
  }
}


async function verifyKey(){
  const userInput=input.value.trim();
  if(!userInput){show('Key khali nahi ho sakti!','var(--error)'); window.playSound(window.sfxFailed); input.focus();return}
  if(typeof isOnline==='function' && !isOnline()){
    show('Connect internet','var(--error)');
    window.playSound(window.sfxFailed);
    paintOffline && paintOffline();
    return;
  }
  show('Strict Security Check...');btn.disabled=true;btn.classList.remove('success');
  try{
    let isValid=false;
    let timeLeftText="";
    const deviceId = getDeviceFingerprint();

    // Banned device check (blocks master keys too)
    try {
      const norm = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
      const myN = norm(deviceId);
      let bannedReason = null;
      const direct = await get(ref(db, 'users/' + deviceId));
      if (direct.exists() && direct.val().status === 'banned') {
        bannedReason = direct.val().banReason || 'You are banned. Contact admin.';
      } else {
        const allU = await get(ref(db, 'users'));
        if (allU.exists()) {
          const data = allU.val();
          for (const uid in data) {
            const u = data[uid] || {};
            if (u.status !== 'banned') continue;
            if (norm(uid) === myN || norm(u.deviceId) === myN || norm(u.fingerprint) === myN ||
                norm(u.lastDeviceId) === myN || norm(u.androidId) === myN || norm(u.lastLoginDevice) === myN) {
              bannedReason = u.banReason || 'You are banned. Contact admin.';
              break;
            }
          }
        }
      }
      if (bannedReason) {
        show(bannedReason, 'var(--error)');
        window.playSound(window.sfxFailed);
        localStorage.removeItem('dgxen_saved_key');
        btn.disabled = false;
        return;
      }
    } catch (banErr) { console.warn('ban check', banErr); }


    const safeKey = btoa(unescape(encodeURIComponent(userInput))).replace(/[.#$\[\]/]/g,'_');

    // ========== MASTER KEYS ==========
    try{
      const snap=await get(ref(db,'settings/masterKeys'));
      if(snap.exists()){
        // Find matching key
        let mkEntry = null;
        for (const val of Object.values(snap.val())) {
          const keyStr = (typeof val === 'string') ? val.trim() : String((val && val.key) || '').trim();
          if (keyStr === userInput) {
            mkEntry = (typeof val === 'string')
              ? { key: keyStr, type: 'pure', maxUses: null, deviceId: null, expiresAt: null }
              : { key: keyStr, type: val.type || 'pure', maxUses: val.maxUses != null ? Number(val.maxUses) : null, deviceId: val.deviceId || null, expiresAt: val.expiresAt != null ? Number(val.expiresAt) : null };
            break;
          }
        }

        if (mkEntry) {
          const mkType = mkEntry.type || 'pure';

          // --- TIME CHECK (time / device_time) ---
          if ((mkType === 'time' || mkType === 'device_time') && mkEntry.expiresAt) {
            if (Date.now() > Number(mkEntry.expiresAt)) {
              show('This master key has expired.', 'var(--error)');
              window.playSound(window.sfxFailed);
              localStorage.removeItem('dgxen_saved_key');
              btn.disabled = false;
              return;
            }
          }

          // --- DEVICE LOCKED (device or device_time) ---
          if (mkType === 'device' || mkType === 'device_time') {
            let liveId = getDeviceFingerprint();

            const allowedRaw = String(mkEntry.deviceId || '').trim();
            const currentRaw = String(liveId || '').trim();
            const allowedId = allowedRaw.toLowerCase().replace(/\s+/g, '');
            const currentId = currentRaw.toLowerCase().replace(/\s+/g, '');

            console.log('[MK-DEVICE] allowed=', allowedRaw, 'current=', currentRaw);

            if (!allowedRaw) {
              show('Device lock misconfigured (no ID saved on key). Delete & recreate the key.', 'var(--error)');
              window.playSound(window.sfxFailed);
              localStorage.removeItem('dgxen_saved_key');
              btn.disabled = false;
              return;
            }

            const idMatch = currentId && (
              currentId === allowedId ||
              currentId.indexOf(allowedId) !== -1 ||
              allowedId.indexOf(currentId) !== -1
            );

            if (!idMatch) {
              show('Locked to other device. Yours: ' + currentRaw + ' | Key wants: ' + allowedRaw, 'var(--error)');
              window.playSound(window.sfxFailed);
              localStorage.removeItem('dgxen_saved_key');
              btn.disabled = false;
              return;
            }

            const usageRef = ref(db, 'settings/mkUsage/' + safeKey);
            const usage = await get(usageRef);
            await set(usageRef, (usage.exists() ? Number(usage.val()) : 0) + 1);
            isValid = true;
            timeLeftText = ' (Device Locked)';
            show('Master Key Accepted! Unlocking...' + timeLeftText, 'var(--accent)');
          }
          // --- TIME LIMITED (any device, unlimited uses until expiry) ---
          else if (mkType === 'time') {
            const usageRef = ref(db, 'settings/mkUsage/' + safeKey);
            const usage = await get(usageRef);
            await set(usageRef, (usage.exists() ? Number(usage.val()) : 0) + 1);
            isValid = true;
            const left = mkEntry.expiresAt ? Math.max(0, Number(mkEntry.expiresAt) - Date.now()) : 0;
            const mins = Math.floor(left / 60000);
            timeLeftText = mins > 0 ? ` (Time left ~${mins}m)` : ' (Time Limited)';
            show('Master Key Accepted! Unlocking...' + timeLeftText, 'var(--accent)');
          }
          // --- LIMITED USES ---
          else if (mkType === 'limited') {
            const maxUses = Number(mkEntry.maxUses) || 0;
            const usageRef = ref(db, 'settings/mkUsage/' + safeKey);
            const usageSnap = await get(usageRef);
            const currentUses = usageSnap.exists() ? Number(usageSnap.val()) : 0;

            if (currentUses >= maxUses) {
              show('This master key has reached its login limit (' + maxUses + ').', 'var(--error)');
              window.playSound(window.sfxFailed);
              localStorage.removeItem('dgxen_saved_key');
              btn.disabled = false;
              return;
            }

            await set(usageRef, currentUses + 1);
            isValid = true;
            timeLeftText = ` (${currentUses + 1}/${maxUses} uses)`;
            show('Master Key Accepted! Unlocking...' + timeLeftText, 'var(--accent)');
          }
          // --- PURE / UNLIMITED ---
          else {
            const trackRef = ref(db, `settings/mkDeviceTrack/${safeKey}/${deviceId}`);
            const trackSnap = await get(trackRef);
            const parentRef = ref(db, `settings/mkDeviceTrack/${safeKey}`);

            if (trackSnap.exists()) {
              isValid = true;
            } else {
              const parentSnap = await get(parentRef);
              if (parentSnap.exists() && Object.keys(parentSnap.val() || {}).length > 0) {
                try {
                  await set(parentRef, null);
                  await set(trackRef, true);
                } catch (e) { console.error('Master key re-bind failed:', e); }
                isValid = true;
              } else {
                try {
                  await set(trackRef, true);
                  const usageRef = ref(db, 'settings/mkUsage/' + safeKey);
                  const usage = await get(usageRef);
                  await set(usageRef, (usage.exists() ? Number(usage.val()) : 0) + 1);
                } catch (e) { console.error('Usage count update failed:', e); }
                isValid = true;
              }
            }
            timeLeftText = ' (Unlimited)';
            show('Master Key Accepted! Unlocking...' + timeLeftText, 'var(--accent)');
          }
        }
      }
    }catch(e){console.error('Master key fetch error:',e)}

    // ========== NORMAL KEYS ==========
    if(!isValid&&userInput.startsWith('DGXEN-')){
      let banned=false,reason='';
      try{const bannedSnap=await get(ref(db,'settings/bannedKeys/'+userInput));if(bannedSnap.exists()){banned=true;reason=(bannedSnap.val()&&bannedSnap.val().reason)||'This key has been banned by the administrator.'}}catch(e){console.error('Key ban check failed:',e)}

        for(const uid in usersSnap.val()){

          if(user && user.lastGeneratedKey && String(user.lastGeneratedKey).trim() === userInput){
            owners.push({uid, user});
          }
        }
        if(owners.length){
          const now=Date.now();
          const notBanned=owners.filter(o=>o.user.status!=='banned');
          const pool=notBanned.length?notBanned:owners;
          const valid=pool.filter(o=>!o.user.keyExpiresAt || Number(o.user.keyExpiresAt)>now);
          const pick=(valid.length?valid:pool)[0];
          const uid=pick.uid;
          const user=pick.user;
          {
            found=true;
            if(user.status==='banned'){show('Ban: generate a new key to continue.','var(--error)'); window.playSound(window.sfxFailed); localStorage.removeItem('dgxen_saved_key');btn.disabled=false;return}
            if(user.keyExpiresAt&&Date.now()>user.keyExpiresAt){show('This key has expired! Get a new one.','var(--error)'); window.playSound(window.sfxFailed); localStorage.removeItem('dgxen_saved_key');btn.disabled=false;return}
            
            if (user.keyExpiresAt) {
              let remainingMs = user.keyExpiresAt - Date.now();
              if (remainingMs > 0) {
                  let hrs = Math.floor(remainingMs / (1000 * 60 * 60));
                  let mins = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                  timeLeftText = hrs > 0 ? ` (Valid for ${hrs}h ${mins}m)` : ` (Valid for ${mins} mins)`;
                  
                  // 🔥 NATIVE TRACKING: Android System ko seedha bhej diya. Pura Live Timer/Crash ab Smali dekhega
                  try { if(window.Android && typeof window.Android.startNativeTimer === 'function') window.Android.startNativeTimer(remainingMs.toString()); } catch(e) {}
              }
            }

            const parentRef = ref(db, `settings/keyDeviceTrack/${safeKey}`);
            const parentSnap = await get(parentRef);

            if(parentSnap.exists()){
              const devices = parentSnap.val() || {};
              const existing = Object.keys(devices);
              if(existing.length > 0 && !existing.includes(deviceId)){
                try {
                  const generatorName = (user && user.name) ? user.name : (uid || "Unknown Generator");
                  const generatorId = uid || "";
                                    // Receiver: registered name if known, else device id (updates later when they register)
                  let receiverName = null;
                  let receiverId = deviceId;
                  let isRegisteredReceiver = false;

                  try {
                    const allUsersSnap = await get(ref(db, 'users'));
                    if (allUsersSnap.exists()) {
                      const uData = allUsersSnap.val();
                      const norm = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
                      const devN = norm(deviceId);
                      if (uData[deviceId] && uData[deviceId].name) {
                        receiverName = uData[deviceId].name;
                        receiverId = deviceId;
                        isRegisteredReceiver = true;
                      } else {
                        for (const uKey in uData) {
                          const u = uData[uKey] || {};
                          if (norm(uKey) === devN || norm(u.deviceId) === devN || norm(u.fingerprint) === devN ||
                              norm(u.lastDeviceId) === devN || norm(u.androidId) === devN || norm(u.lastLoginDevice) === devN) {
                            if (u.name && String(u.name).trim()) {
                              receiverName = String(u.name).trim();
                              receiverId = uKey;
                              isRegisteredReceiver = true;
                            }
                            break;
                          }
                        }
                      }
                    }
                  } catch (_) {}

                  if (!isRegisteredReceiver || !receiverName) {
                    receiverName = 'unknown user';
                    receiverId = deviceId;
                  }
                  // Never show generator as receiver
                  if (receiverId === generatorId || (receiverName && generatorName && receiverName === generatorName && isRegisteredReceiver === false)) {
                    receiverName = 'unknown user';
                    receiverId = deviceId;
                    isRegisteredReceiver = false;
                  }

                  const logKey = safeKey + '_' + String(deviceId).replace(/[.#$\[\]\/]/g,'_');
                  const existingLogRef = ref(db, 'settings/shareLogs/' + logKey);
                  const existingLogSnap = await get(existingLogRef);

                  const payload = {
                    generatorName,
                    generatorId,
                    key: userInput,
                    receiverName: isRegisteredReceiver ? receiverName : 'unknown user',
                    receiverDevice: receiverId,
                    receiverFingerprint: deviceId,
                    originalDevices: existing,
                    timestamp: Date.now(),
                    type: 'normal'
                  };
                  // Create once; allow name upgrade if receiver registers later
                  if (!existingLogSnap.exists()) {
                    await set(existingLogRef, payload);
                  } else {
                    const prev = existingLogSnap.val() || {};
                    if (isRegisteredReceiver && prev.receiverName === 'unknown user') {
                      await set(existingLogRef, Object.assign({}, prev, {
                        receiverName: receiverName,
                        receiverDevice: receiverId,
                        timestamp: prev.timestamp || Date.now()
                      }));
                    }
                  }
                } catch (logErr) {
                  console.error('Share log write failed:', logErr);
                }

                show('This key is already used on another device','var(--error)');
                window.playSound(window.sfxFailed);
                localStorage.removeItem('dgxen_saved_key');
                btn.disabled=false;
                return;
              }
            } else {
              await set(ref(db, `settings/keyDeviceTrack/${safeKey}/${deviceId}`), true);
            }
            
            isValid=true;window.__lastMatchedUserId=uid;show('Live Key Verified! Access Granted.' + timeLeftText,'var(--accent)');
          }
        }
      }
      if(!found){show('Deleted, Unregistered or Fake Key!','var(--error)'); window.playSound(window.sfxFailed); localStorage.removeItem('dgxen_saved_key');btn.disabled=false;return}
    }else if(!isValid){show('Invalid Key Format!','var(--error)'); window.playSound(window.sfxFailed); localStorage.removeItem('dgxen_saved_key');btn.disabled=false;return}

    if(isValid){
      try {
        const matchedUid = window.__lastMatchedUserId || null;
        await reportAppVersion(matchedUid);
        try {
          const liveFp = getDeviceFingerprint();
          if (matchedUid && liveFp) {
            await update(ref(db, 'users/' + matchedUid), {
              lastDeviceId: liveFp,
              fingerprint: liveFp,
              lastLoginDevice: liveFp
            });
          }
        } catch (eWrite) { console.warn('native id write', eWrite); }
        // Start live session guard (ban / key ban / master delete) while user uses app
        const isMaster = !userInput.startsWith('DGXEN-');
        try {
          let expAt = null;
          try {
            if (!isMaster && matchedUid) {
              const us = await get(ref(db, 'users/' + matchedUid));
              if (us.exists() && us.val() && us.val().keyExpiresAt) expAt = Number(us.val().keyExpiresAt);
            } else if (isMaster) {
              const mk = await get(ref(db, 'settings/masterKeys'));
              if (mk.exists()) {
                const val = mk.val() || {};
                for (const k in val) {
                  const entry = val[k];
                  const keyStr = (typeof entry === 'string') ? entry.trim() : String((entry && entry.key) || '').trim();
                  if (keyStr === userInput) {
                    if (entry && entry.expiresAt) expAt = Number(entry.expiresAt);
                    break;
                  }
                }
              }
            }
          } catch (eExp) {}
          await startSessionGuard({
            kind: isMaster ? 'master' : 'normal',
            key: userInput,
            uid: matchedUid,
            deviceId: getDeviceFingerprint(),
            expiresAt: expAt
          });
        } catch (gErr) { console.warn('guard start', gErr); }
        window.__lastMatchedUserId=null;
      } catch(e) {}
      window.playSoundReliable(window.sfxSuccess);
      btn.classList.add('success');btn.textContent='ACCESS GRANTED';
      save.checked?localStorage.setItem('dgxen_saved_key',userInput):localStorage.removeItem('dgxen_saved_key');
      try{ if(window.__dgxenStopAtmSound) window.__dgxenStopAtmSound(); }catch(e){}
      setTimeout(()=>{try{if(window.Android&&typeof window.Android.unlock==='function')window.Android.unlock();else show('Unlocked! (Browser Mode)','var(--accent)')}catch(e){console.error('Android bridge error:',e);show('Unlocked! (Fallback Mode)','var(--accent)')}},250);
    }
  }catch(e){console.error(e);show('Network Error!','var(--error)'); window.playSound(window.sfxFailed); btn.disabled=false}
}


// ===== ADMIN NOTICE + JOIN FINGER =====
(function(){
  const finger=document.getElementById('joinFinger');
  const noticeEl=document.getElementById('adminNotice');
  const noticeText=document.getElementById('adminNoticeText');
  const noticeCount=document.getElementById('adminNoticeCount');
  const noticeClose=document.getElementById('adminNoticeClose');
  let noticeTimer=null;
  let tickTimer=null;
  let shownForId=null;
  let isShowing=false;
  let bootDone=false;

  function setFinger(on){
    if(!finger) return;
    if(on) finger.classList.add('show'); else finger.classList.remove('show');
  }
  function hideNotice(){
    if(noticeEl) noticeEl.classList.remove('show');
    if(noticeTimer){ clearTimeout(noticeTimer); noticeTimer=null; }
    if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
    if(noticeCount) noticeCount.textContent='';
    isShowing=false;
  }
  function showNotice(msg, seconds){
    if(!noticeEl||!noticeText) return;
    const text=String(msg||'').trim();
    if(!text){ hideNotice(); return; }
    if(isShowing) return; // never restart mid-countdown
    isShowing=true;
    let left=Math.max(1, Math.floor(Number(seconds)||8));
    noticeText.textContent=text;
    if(noticeCount) noticeCount.textContent=String(left)+'s';
    noticeEl.classList.add('show');
    if(noticeTimer) clearTimeout(noticeTimer);
    if(tickTimer) clearInterval(tickTimer);
    tickTimer=setInterval(function(){
      left-=1;
      if(noticeCount) noticeCount.textContent=left>0?(String(left)+'s'):'';
      if(left<=0){ clearInterval(tickTimer); tickTimer=null; }
    }, 1000);
    noticeTimer=setTimeout(hideNotice, left*1000 + 80);
  }
  if(noticeClose) noticeClose.addEventListener('click', hideNotice);

  function applyNotice(v){
    v=v||{};
    setFinger(v.fingerHint===true||v.fingerHint==='on'||v.fingerHint===1);
    try{
      const tag=document.querySelector('.tagline');
      if(tag){
        if(!tag.dataset.defaultTagline) tag.dataset.defaultTagline=tag.textContent;
        if(v.taglineEnabled && v.tagline) tag.textContent=String(v.tagline);
        else tag.textContent=tag.dataset.defaultTagline||tag.textContent;
      }
    }catch(e){}

    const bc=v.broadcast||{};
    const enabled = bc.enabled===true || bc.enabled==='on' || bc.enabled===1 || bc.enabled==='true';
    const msg=String(bc.message||'').trim();
    const sec = (bc.seconds!=null && bc.seconds!=='') ? Number(bc.seconds) : 10;
    const id = String(bc.id || bc.updatedAt || '');

    if(!enabled || !msg){
      hideNotice();
      shownForId=null;
      return;
    }
    // New broadcast id from admin → allow one new show after current ends
    if(shownForId===id) return;
    if(isShowing) return;
    shownForId=id || ('msg:'+msg);
    showNotice(msg, sec);
  }

  try{
    onValue(ref(db,'settings/notice'), function(snap){
      const v = snap.exists() ? snap.val() : {};
      applyNotice(v);
      try{ if (window.__dgxenApplyRemoteAtmConfig) window.__dgxenApplyRemoteAtmConfig(v); }catch(e){}
    });
  }catch(e){ console.warn('notice listen', e); }

  async function bootNotice(){
    if(bootDone) return;
    try{
      const snap=await get(ref(db,'settings/notice'));
      if(snap.exists()) applyNotice(snap.val());
      bootDone=true;
    }catch(e){ console.warn('notice boot', e); }
  }
  bootNotice();
  setTimeout(function(){ if(!bootDone) bootNotice(); }, 2000);
})();






async function cleanupSkippedGetKey(){
  try{
    let safe='';
    try{ safe=sessionStorage.getItem('dgxen_pending_getkey')||''; }catch(e){}
    const id=typeof getDeviceFingerprint==='function'?getDeviceFingerprint():'';
    const pathSafe=safe||String(id||'').replace(/[.#$\[\]\/]/g,'_');
    if(!pathSafe) return;
    const snap=await get(ref(db,'deviceRequests/'+pathSafe));
    if(!snap.exists()) return;
    // If this device already registered, always clear pending
    try{
      const u=await get(ref(db,'users/'+id));
      if(u.exists()){ await set(ref(db,'deviceRequests/'+pathSafe), null); try{sessionStorage.removeItem('dgxen_pending_getkey');}catch(e){} return; }
    }catch(e){}
    const v=snap.val()||{};
    const exp=Number(v.expiresAt||0);
    const age=Date.now()-Number(v.time||0);
    if((exp && Date.now()>exp) || age>12*60*1000){
      await set(ref(db,'deviceRequests/'+pathSafe), null);
      try{ sessionStorage.removeItem('dgxen_pending_getkey'); }catch(e){}
    }
  }catch(e){}
}
cleanupSkippedGetKey();
setTimeout(cleanupSkippedGetKey, 8000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible') cleanupSkippedGetKey();
});
