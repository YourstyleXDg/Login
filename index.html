<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050706">
<title>3D Liquid Wave Effect</title>
<style>
/* Basic Background setup so the glass effect is visible */
html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at 14% 13%, rgba(255,255,255,.075), transparent 26%),
                radial-gradient(circle at 88% 82%, rgba(0,255,136,.10), transparent 32%),
                linear-gradient(145deg, #020302 0%, #070a08 48%, #020403 100%);
}

/* ========================================================= */
/* 🔥 3D LIQUID WAVES & STEADY WATER EFFECT 🔥 */
/* ========================================================= */
.sea-glass-module {
    position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
}
.wave-layer {
    position: absolute; top: -75vmax; left: -75vmax; width: 150vmax; height: 150vmax;
    opacity: 0; transform-origin: center;
}
.liquid-shape {
    width: 100%; height: 100%;
    border-radius: 40% 60% 45% 55% / 45% 55% 40% 60%;
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.01) 40%, transparent 100%);
    border: 2px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(255, 50, 50, 0.25), inset 0 0 40px rgba(0, 255, 255, 0.3), inset 20px 20px 40px rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(25px) saturate(220%) contrast(150%);
    -webkit-backdrop-filter: blur(25px) saturate(220%) contrast(150%);
}

/* 
   Animation Starts EXACTLY after 1.85s (When Unfold Animation finishes) 
   Waves are Continuous (infinite) and spaced by 1.5 seconds.
*/
.w-1 { animation: waveWash 6s cubic-bezier(0.2, 0.8, 0.3, 1) 1.85s infinite; }
.w-1 .liquid-shape { animation: seaSpin 6s linear infinite; }

.w-2 { animation: waveWash 6s cubic-bezier(0.2, 0.8, 0.3, 1) 3.35s infinite; }
.w-2 .liquid-shape { animation: seaSpin 7s linear infinite reverse; border-color: rgba(0,255,136,0.3); }

.w-3 { animation: waveWash 6s cubic-bezier(0.2, 0.8, 0.3, 1) 4.85s infinite; }
.w-3 .liquid-shape { animation: seaSpin 6.5s linear infinite; }

.w-4 { animation: waveWash 6s cubic-bezier(0.2, 0.8, 0.3, 1) 6.35s infinite; }
.w-4 .liquid-shape { animation: seaSpin 7.5s linear infinite reverse; }

@keyframes waveWash {
    0% { transform: scale(0.02); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: scale(2.8); opacity: 0; }
}
@keyframes seaSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.steady-water-surface {
    position: absolute; top: -50vmax; left: -50vmax; width: 200vmax; height: 200vmax;
    border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%;
    background: radial-gradient(circle at center, rgba(255,255,255,0.03), transparent 60%);
    box-shadow: inset 0 0 50px rgba(0, 255, 136, 0.05);
    backdrop-filter: blur(12px) saturate(130%);
    -webkit-backdrop-filter: blur(12px) saturate(130%);
    opacity: 0; transform-origin: center;
    /* Fades in starting at exactly 1.85s */
    animation: waterFadeIn 3s ease 1.85s forwards, steadyFlow 25s linear 1.85s infinite;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.6s ease;
}
@keyframes waterFadeIn {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes steadyFlow {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.05); }
    100% { transform: rotate(360deg) scale(1); }
}
</style>
</head>
<body>

<!-- 🔥 LIQUID WAVES & WATER SURFACE 🔥 -->
<div class="sea-glass-module">
    <div class="wave-layer w-1"><div class="liquid-shape"></div></div>
    <div class="wave-layer w-2"><div class="liquid-shape"></div></div>
    <div class="wave-layer w-3"><div class="liquid-shape"></div></div>
    <div class="wave-layer w-4"><div class="liquid-shape"></div></div>
    <div class="steady-water-surface"></div>
</div>

</body>
</html>
